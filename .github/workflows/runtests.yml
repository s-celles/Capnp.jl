name: Run tests

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia-version: '1.10'
            os: ubuntu-latest
            arch: x64
          - julia-version: '1'
            os: ubuntu-latest
            arch: x64
          - julia-version: '1'
            os: macos-latest
            arch: aarch64
          - julia-version: '1'
            os: windows-latest
            arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - name: Install Cap'n Proto (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --show-error --location \
            https://capnproto.org/capnproto-c++-1.3.0.tar.gz \
            --output capnproto.tar.gz
          tar xzf capnproto.tar.gz
          cd capnproto-c++-1.3.0
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          capnp --version

      - name: Install Cap'n Proto (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install capnp
          capnp --version

      - name: Install Cap'n Proto (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install capnproto -y
          capnp --version

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1

      - name: Process coverage
        if: runner.os == 'Linux' && matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.julia-version == '1'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
